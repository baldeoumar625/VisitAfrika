<!DOCTYPE html>
<!--
    PROJET: VISIT AFRIKA
    FICHIER: inscription.html
    DESCRIPTION: Composant du projet Visit Afrika.
-->

<html lang="fr-FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="style.css">
    <title>Inscription - Visit Afrika</title>
    <link rel="icon" type="image/jpg" href="../images/logo/logo.png">
</head>
<body>

    <!-- FORMULAIRE -->
    <main class="form-container">
        <div class="form-wrapper">
            <div class="form-header">
                <h1><i class="fas fa-user-plus"></i> Inscription</h1>
                <p>Créez votre compte Visit Afrika</p>
            </div>

            <form action="#" method="POST" class="inscription-form">
                <!-- Champs Nom et Prénom -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="nom">Nom *</label>
                        <input type="text" id="nom" name="nom" required>
                    </div>
                    <div class="form-group">
                        <label for="prenom">Prénom *</label>
                        <input type="text" id="prenom" name="prenom" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Adresse Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <!-- Téléphone -->
                <div class="form-group">
                    <label for="telephone">Téléphone</label>
                    <input type="tel" id="telephone" name="telephone" placeholder="+224...">
                </div>

                <!-- Mot de passe -->
                <div class="form-group">
                    <label for="password">Mot de Passe *</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirmation mot de passe -->
                <div class="form-group">
                    <label for="confirmPassword">Confirmer le Mot de Passe *</label>
                    <div class="password-container">
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                        <button type="button" class="toggle-password" id="toggleConfirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Conditions -->
                <div class="form-group checkbox">
                    <input type="checkbox" id="conditions" name="conditions" required>
                    <label for="conditions">J'accepte les <a href="#">conditions d'utilisation</a> *</label>
                </div>

                <!-- Bouton -->
                <button type="submit" class="btn-submit">S'inscrire</button>

                <div class="divider">OU</div>

                <a href="http://localhost:8000/api/auth/google/login" class="btn-google">
                    <i class="fab fa-google"></i> S'inscrire avec Google
                </a>

                <!-- Lien connexion -->
                <p class="form-link">Vous avez déjà un compte ? <a href="connection.html">Se connecter</a></p>
            </form>
        </div>
    </main>

    <script src="../js/vendors/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
    <script>
        // Mobile menu toggle (if present)
        const menuToggle = document.getElementById('menuToggle');
        if (menuToggle) {
            menuToggle.addEventListener('click', function() {
                this.classList.toggle('active');
                const navbarMenu = document.getElementById('navbarMenu');
                if (navbarMenu) navbarMenu.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
