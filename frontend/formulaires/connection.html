<!DOCTYPE html>
<!--
    PROJET: VISIT AFRIKA
    FICHIER: connection.html
    DESCRIPTION: Composant du projet Visit Afrika.
-->

<html lang="fr-FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="style.css">
    <title>Connexion - Visit Afrika</title>
    <link rel="icon" type="image/jpg" href="../images/logo/logo.png">
</head>
<body>
    <!-- FORMULAIRE -->
    <main class="form-container">
        <div class="form-wrapper">
            <div class="form-header">
                <h1><i class="fas fa-sign-in-alt"></i> Connexion</h1>
                <p>Connectez-vous à votre compte Visit Afrika</p>
            </div>

            <form action="#" method="POST" class="connection-form">
                <!-- Email -->
                <div class="form-group">
                    <label for="email">Adresse Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <!-- Mot de passe -->
                <div class="form-group">
                    <label for="password">Mot de Passe *</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Se souvenir -->
                <div class="form-group checkbox">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Se souvenir de moi</label>
                </div>

                <!-- Bouton -->
                <button type="submit" class="btn-submit">Se connecter</button>

                <div class="divider">OU</div>

                <a href="http://localhost:8000/api/auth/google/login" class="btn-google">
                    <i class="fab fa-google"></i> Continuer avec Google
                </a>

                <!-- Lien mot de passe oublié -->
                <p class="form-link">
                    <a href="#" id="forgotPasswordLink">Mot de passe oublié ?</a>
                </p>

                <!-- Lien inscription -->
                <p class="form-link">Vous n'avez pas de compte ? <a href="inscription.html">S'inscrire</a></p>
            </form>
        </div>
    </main>

    <!-- MODAL REINITIALISATION MOT DE PASSE -->
    <div id="resetModal" class="reset-modal">
        <div class="reset-modal-content">
            <span class="reset-modal-close" id="closeResetModal">&times;</span>
            <div class="form-header">
                <h2><i class="fas fa-key"></i> Mot de passe oublié</h2>
                <p>Saisissez votre e-mail et votre nouveau mot de passe</p>
            </div>
            <form id="resetPasswordForm" class="inscription-form">
                <div class="form-group">
                    <label for="resetEmail">Adresse Email *</label>
                    <input type="email" id="resetEmail" name="email" required placeholder="votre.email@exemple.com">
                </div>
                <div class="form-group">
                    <label for="newPassword">Nouveau mot de passe *</label>
                    <input type="password" id="newPassword" name="new_password" required minlength="4">
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">Confirmer le mot de passe *</label>
                    <input type="password" id="confirmNewPassword" name="confirm_password" required minlength="4">
                </div>
                <button type="submit" class="btn-submit">Réinitialiser le mot de passe</button>
            </form>
        </div>
    </div>

    <script src="../js/vendors/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
    <script>
        // Mobile menu toggle (if present)
        const menuToggle = document.getElementById('menuToggle');
        if (menuToggle) {
            menuToggle.addEventListener('click', function() {
                this.classList.toggle('active');
                const navbarMenu = document.getElementById('navbarMenu');
                if (navbarMenu) navbarMenu.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
